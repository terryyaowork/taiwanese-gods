<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 台灣神明介紹 site icon: swallow-tail temple roof (燕尾脊) in gold on temple red -->
  <rect width="128" height="128" rx="24" fill="#8B1A1A"/>
  <!-- upper roof with swallow-tail upturned ends -->
  <path d="M14 58 C 20 38, 40 30, 64 30 C 88 30, 108 38, 114 58 L 104 54 C 96 42, 82 38, 64 38 C 46 38, 32 42, 24 54 Z" fill="#E8B54D"/>
  <!-- swallow tail tips -->
  <path d="M14 58 C 10 52, 8 46, 8 40 C 14 46, 18 50, 22 52 Z" fill="#E8B54D"/>
  <path d="M114 58 C 118 52, 120 46, 120 40 C 114 46, 110 50, 106 52 Z" fill="#E8B54D"/>
  <!-- ridge beam -->
  <rect x="30" y="56" width="68" height="6" rx="3" fill="#E8B54D"/>
  <!-- pillars -->
  <rect x="36" y="66" width="8" height="38" rx="2" fill="#E8B54D"/>
  <rect x="84" y="66" width="8" height="38" rx="2" fill="#E8B54D"/>
  <!-- door / altar opening -->
  <path d="M54 104 L54 78 C 54 71, 58 68, 64 68 C 70 68, 74 71, 74 78 L74 104 Z" fill="#E8B54D"/>
  <!-- base -->
  <rect x="26" y="104" width="76" height="8" rx="3" fill="#E8B54D"/>
</svg>
